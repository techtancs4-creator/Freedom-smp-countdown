*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;overflow:hidden;background:#12061f;font-family:"Bungee","Arial Black",Impact,sans-serif}
body::before{content:"";position:fixed;inset:-20px;z-index:-1;background:var(--img) center/cover;filter:blur(14px) brightness(.45)}
#app{position:fixed;inset:0;container-type:size;animation:appIn 1s ease both}
@media (orientation:portrait) and (pointer:coarse){
#app{inset:auto;top:0;left:0;width:100vh;height:100vw;width:100dvh;height:100dvw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg);transform:translateX(100dvw) rotate(90deg)}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100cqw,177.69cqh);aspect-ratio:1672/941;container-type:inline-size;background:var(--img) center/100% 100%}
.t{position:absolute;top:58.3%;transform:translate(-50%,-50%);font-size:var(--fs);line-height:1;white-space:nowrap;letter-spacing:.02em;opacity:0;transition:opacity .7s ease;filter:drop-shadow(0 .045em 0 #8a4a00) drop-shadow(0 .09em 0 #4a2500) drop-shadow(0 0 .25em rgba(255,170,0,.65))}
.ready .t{opacity:1}

.lbl{position:absolute;top:66.7%;width:9.5%;height:4.8%;transform:translate(-50%,-50%);display:grid;place-items:center;font-size:1.25cqw;white-space:nowrap;font-style:italic;line-height:1;letter-spacing:.04em;color:#f6ece6;text-shadow:0 .09em 0 #000;background:linear-gradient(#4a4348,#2e282c);border:.22cqw solid #1a1417;border-radius:.3cqw;box-shadow:0 .4cqw 0 #8a4a1e,0 .8cqw 1.2cqw rgba(0,0,0,.5);opacity:0;transition:opacity .7s ease}

.hint.show{opacity:.85;animation:pulse 2.2s ease-in-out infinite}
.pop{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:16px;background:rgba(10,3,20,.78)}
.on .pop{display:grid;animation:fade .6s ease both}
.pop-card{padding:clamp(18px,4cqw,44px) clamp(18px,5cqw,60px);text-align:center;background:linear-gradient(#6b3a12,#2c1607);border:4px solid #ffb52e;border-radius:6px;box-shadow:inset 0 0 0 3px #1b0d03,0 0 0 4px #1b0d03,0 0 60px rgba(255,170,0,.7);animation:popIn 1s cubic-bezier(.34,1.4,.64,1) .1s both,glow 2.4s ease-in-out 1.1s infinite alternate}
.pop-card h2{font-weight:400;font-size:clamp(20px,6cqw,72px);line-height:1.2;letter-spacing:.03em;color:var(--gold);user-select:all;text-shadow:0 .06em 0 #8a4a00,0 0 .45em rgba(255,150,0,.65)}
.copy{margin-top:clamp(14px,2.6cqw,28px);padding:.8em 1.6em;font:inherit;font-size:clamp(12px,2.2cqw,22px);letter-spacing:.06em;color:#fff;text-shadow:0 2px 0 #123009;background:linear-gradient(#58a830,#2f6416);border:3px solid #123009;border-radius:4px;box-shadow:inset 0 0 0 2px #86d853,0 4px 0 #0b1c05;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.copy:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px #86d853,0 1px 0 #0b1c05}

.burst i{position:absolute;top:50%;left:50%;width:var(--s);height:var(--s);background:var(--c);box-shadow:0 0 8px var(--c);animation:burst 1.6s cubic-bezier(.2,.7,.3,1) both}
@keyframes appIn{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:.4}}
@keyframes pulse{50%{opacity:.35}}
@keyframes popIn{0%{transform:scale(.2) rotate(-6deg);opacity:0}60%{transform:scale(1.1) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes glow{to{box-shadow:inset 0 0 0 3px #1b0d03,0 0 0 4px #1b0d03,0 0 100px rgba(255,190,40,.95)}}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(300deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.burst,.c{display:none}.on .pop,.pop-card{animation:none}}

<script>
// >>> LAUNCH TIME: change only this line. +05:30 = IST, so it is the same for everyone (22:59 = 10:59 PM).
const LAUNCH = "2026-11-19T22:59:00+05:30";

const t0 = new Date(LAUNCH).getTime();
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
let last = null, done = false;

/* ---------- soft sound (always on; browsers start audio after the first tap) ---------- */
let ac = null, master = null;
try {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0.9;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 4200;
  master.connect(lp); lp.connect(ac.destination);
} catch (e) { ac = null; }
function note(freq, at, dur, vol) {
  if (!ac || ac.state !== "running") return;
  const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function tick(s) {
  const hi = s % 2 === 0;
  note(hi ? 1318.5 : 987.8, 0, 0.12, 0.09);
  note(hi ? 2637 : 1975.5, 0, 0.05, 0.02);
  if (s <= 5) note(1046.5, 0.03, 0.28, 0.06);
}
function chime() {
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => { note(f, i * 0.17, 1.7, 0.11); note(f * 2, i * 0.17, 0.9, 0.025); });
}
const hint = $("hint");
function syncHint() { hint.classList.toggle("show", !!ac && ac.state !== "running" && !done); }
function unlock() { if (ac && ac.state !== "running") ac.resume().then(syncHint, () => {}); }
["pointerdown", "touchend", "keydown", "click"].forEach(ev => addEventListener(ev, unlock, { passive: true }));
if (ac) { ac.onstatechange = syncHint; unlock(); }

/* ---------- celebration ---------- */
function burst() {
  const box = $("burst");
  for (let i = 0; i < 56; i++) {
    const e = document.createElement("i"), a = Math.random() * 6.283, r = 100 + Math.random() * Math.min(innerWidth, innerHeight) * 0.6;
    e.style.cssText = `--s:${(5 + Math.random() * 7) | 0}px;--c:${Math.random() < 0.7 ? "#ffc21a" : "#b36bff"};--x:${Math.cos(a) * r}px;--y:${Math.sin(a) * r}px;animation-delay:${Math.random() * 0.3}s`;
    box.appendChild(e);
  }
}
$("copy").onclick = async () => {
  const txt = $("ip").textContent.trim(), b = $("copy");
  try { await navigator.clipboard.writeText(txt); }
  catch (e) {
    const t = document.createElement("textarea");
    t.value = txt; t.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch (_) {}
    t.remove();
  }
  b.textContent = "COPIED!"; setTimeout(() => { b.textContent = "COPY"; }, 1500);
};

/* ---------- digits ---------- */
const els = { d: $("d"), h: $("h"), m: $("m"), s: $("s") }, cur = {};
function setDigits(id, txt) {
  if (cur[id] === txt) return;
  const sp = els[id].firstChild;
  sp.textContent = txt;
  if (cur[id] !== undefined && !calm && sp.animate)
    sp.animate([{ opacity: 0.2, transform: "translateY(-.14em)" }, { opacity: 1, transform: "none" }], { duration: 340, easing: "cubic-bezier(.2,.7,.2,1)" });
  cur[id] = txt;
}
function finish() { done = true; document.body.classList.add("on"); burst(); chime(); syncHint(); }
function frame() {
  const s = Math.max(0, Math.ceil((t0 - Date.now()) / 1000));
  if (s !== last) {
    const d = Math.floor(s / 86400);
    setDigits("d", pad(d)); els.d.style.fontSize = d > 99 ? "calc(var(--fs) * .72)" : "";
    setDigits("h", pad(Math.floor(s / 3600) % 24));
    setDigits("m", pad(Math.floor(s / 60) % 60));
    setDigits("s", pad(s % 60));
    if (last !== null && s > 0) tick(s);
    if (s === 0) finish();
    last = s;
  }
  if (!done) requestAnimationFrame(frame);
}

/* size the digits to the poster's number band, whatever font is used */
function fit() {
  const stage = $("stage"), sp = els.m.firstChild, keep = sp.textContent;
  stage.style.setProperty("--fs", "10cqw");
  sp.textContent = "00";
  const w = sp.offsetWidth, W = stage.clientWidth;
  sp.textContent = keep;
  if (w > 0 && W > 0) stage.style.setProperty("--fs", (10 * 8.8 / (w / W * 100)).toFixed(2) + "cqw");
}
function ready() { fit(); document.body.classList.add("ready"); syncHint(); }
frame();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(ready);
setTimeout(ready, 1500);
</script>
